included:
  - Sources
  - Tests
  - Examples

excluded:
  - .build

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

file_length:
  warning: 300
  error: 500

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 200
  error: 300

identifier_name:
  min_length: 1
  max_length: 50

opt_in_rules:
  - empty_count
  - explicit_init
  - force_unwrapping
  - implicitly_unwrapped_optional
  - modifier_order
  - operator_usage_whitespace
  - sorted_imports
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  - todo
